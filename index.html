<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="d-flex align-items-center justify-content-center min-vh-100 bg-black"
  >
    <div
      class="translator-card p-4 text-center shadow-lg bg-secondary rounded-4"
    >
      <h1 class="text-white mb-4">
        <span
          class="badge bg-white bg-opacity-25 border border-primary text-info px-4 py-2"
          >Translator App</span
        >
      </h1>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <textarea
            class="fromText form-control custom-textarea"
            placeholder="Enter text"
          ></textarea>
        </div>
        <div class="col-md-6">
          <textarea
            class="toText form-control custom-textarea"
            readonly
            placeholder="Translation"
          ></textarea>
        </div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <select class="fromSelect form-select custom-select"></select>
        </div>
        <div class="col-md-6">
          <select class="toSelect form-select custom-select"></select>
        </div>
      </div>
      <button class="btn btn-outline-dark px-4">Translate</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
